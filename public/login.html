<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Connexion</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
  background:linear-gradient(135deg,#f5f1e8,#efe6d6);
}

.card{
  background:white;
  padding:40px;
  border-radius:20px;
  width:320px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:12px;
  border:1px solid #ddd;
}

button{
  width:100%;
  margin-top:15px;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#ceaa33;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="card">
  <h2>Connexion</h2>

  <form method="POST" action="/login">
    <input name="username" placeholder="Utilisateur" required>
    <input name="password" type="password" placeholder="Mot de passe" required>
    <button>Se connecter</button>
  </form>
</div>

</body>
</html>
